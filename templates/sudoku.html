{% extends 'base.html' %}

{% block title %}
Sudoku | HealthNest
{% endblock %}


{% block content %}

<style>

/* =====================================================
   HEALTHNEST SUDOKU
   ===================================================== */


/* ================= PAGE ================= */

.sudoku-page {

    min-height: 650px;

    background: #f4faf9;

    padding: 60px 20px 80px;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    box-sizing: border-box;
}


/* ================= GAME CARD ================= */

.sudoku-card {

    width: min(850px, 100%);

    background: #ffffff;

    border: 1px solid #e1eeee;

    border-radius: 24px;

    padding: 45px 35px 50px;

    text-align: center;

    box-shadow:
        0 10px 35px rgba(30, 60, 65, 0.08);

    box-sizing: border-box;
}


/* ================= TITLE ================= */

.sudoku-card h1 {

    margin: 0 0 30px;

    color: #173f46;

    font-size: clamp(32px, 5vw, 46px);

    line-height: 1.2;
}


/* ================= BOARD ================= */

#sudoku-board {

    border-collapse: collapse;

    margin: 0 auto 30px;

    background: #ffffff;
}


/* ================= CELLS ================= */

#sudoku-board td {

    width: 52px;

    height: 52px;

    padding: 0;

    border: 1px solid #b9d9da;

    box-sizing: border-box;
}


/* ================= INPUT ================= */

#sudoku-board input {

    width: 100%;

    height: 100%;

    padding: 0;

    box-sizing: border-box;

    border: none;

    outline: none;

    background: #ffffff;

    color: #173f46;

    text-align: center;

    font-size: 20px;

    font-weight: 600;
}


/* ================= INPUT FOCUS ================= */

#sudoku-board input:focus {

    background: #eaf6f5;

    box-shadow:
        inset 0 0 0 2px #168c91;
}


/* ================= GIVEN NUMBERS ================= */

#sudoku-board input:disabled {

    background: #e7f3f2;

    color: #173f46;

    font-weight: 800;

    cursor: default;
}


/* =====================================================
   3 × 3 GRID BORDERS
   ===================================================== */


/* Right border after columns 3, 6, 9 */

#sudoku-board td:nth-child(3),
#sudoku-board td:nth-child(6),
#sudoku-board td:nth-child(9) {

    border-right: 3px solid #173f46;
}


/* Left border of columns 1, 4, 7 */

#sudoku-board td:nth-child(1),
#sudoku-board td:nth-child(4),
#sudoku-board td:nth-child(7) {

    border-left: 3px solid #173f46;
}


/* Bottom border after rows 3, 6, 9 */

#sudoku-board tr:nth-child(3) td,
#sudoku-board tr:nth-child(6) td,
#sudoku-board tr:nth-child(9) td {

    border-bottom: 3px solid #173f46;
}


/* Top border of rows 1, 4, 7 */

#sudoku-board tr:nth-child(1) td,
#sudoku-board tr:nth-child(4) td,
#sudoku-board tr:nth-child(7) td {

    border-top: 3px solid #173f46;
}


/* ================= CHECK BUTTON ================= */

.sudoku-check-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 180px;

    height: 48px;

    padding: 0 22px;

    border: none;

    border-radius: 11px;

    background: #168c91;

    color: #ffffff;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.sudoku-check-btn:hover {

    background: #126f73;

    transform: translateY(-2px);
}


/* ================= RESULT ================= */

#result {

    min-height: 25px;

    margin: 22px auto 0;

    color: #173f46;

    font-size: 18px;

    font-weight: 800;

    line-height: 1.5;
}


/* ================= BACK BUTTON ================= */

.sudoku-back-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 180px;

    height: 46px;

    margin-top: 25px;

    padding: 0 22px;

    box-sizing: border-box;

    border: 2px solid #168c91;

    border-radius: 11px;

    background: #ffffff;

    color: #168c91;

    text-decoration: none;

    font-size: 16px;

    font-weight: 800;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.sudoku-back-btn:hover {

    background: #eaf6f5;

    transform: translateY(-2px);
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .sudoku-page {

        padding:
            35px
            10px
            60px;
    }


    .sudoku-card {

        padding:
            30px
            10px
            35px;

        border-radius: 20px;
    }


    .sudoku-card h1 {

        font-size: 32px;

        margin-bottom: 25px;
    }


    #sudoku-board td {

        width: 38px;

        height: 38px;
    }


    #sudoku-board input {

        font-size: 16px;
    }


    .sudoku-check-btn,
    .sudoku-back-btn {

        width: 100%;

        max-width: 260px;
    }

}

</style>


<!-- =====================================================
     SUDOKU GAME
     ===================================================== -->

<section class="sudoku-page">

    <div class="sudoku-card">


        <!-- TITLE -->

        <h1>
            🧩 Sudoku Game
        </h1>


        <!-- BOARD -->

        <table id="sudoku-board"></table>


        <!-- CHECK -->

        <button
            type="button"
            class="sudoku-check-btn"
            onclick="checkSolution()">

            Check Solution

        </button>


        <!-- RESULT -->

        <p id="result"></p>


        <!-- BACK -->

        <a
            href="{% url 'games' %}"
            class="sudoku-back-btn">

            ← Back to Games

        </a>


    </div>

</section>


<script>

/* =====================================================
   SUDOKU GAME LOGIC
   ===================================================== */


const puzzle = [

    [5,3,"","",7,"","","",""],

    [6,"","",1,9,5,"","",""],

    ["",9,8,"","","","",6,""],

    [8,"","","",6,"","","",3],

    [4,"","",8,"",3,"","",1],

    [7,"","","",2,"","","",6],

    ["",6,"","","","",2,8,""],

    ["","","",4,1,9,"","",5],

    ["","","","",8,"","",7,9]

];


const solution = [

    [5,3,4,6,7,8,9,1,2],

    [6,7,2,1,9,5,3,4,8],

    [1,9,8,3,4,2,5,6,7],

    [8,5,9,7,6,1,4,2,3],

    [4,2,6,8,5,3,7,9,1],

    [7,1,3,9,2,4,8,5,6],

    [9,6,1,5,3,7,2,8,4],

    [2,8,7,4,1,9,6,3,5],

    [3,4,5,2,8,6,1,7,9]

];


const board =
    document.getElementById("sudoku-board");


/* =====================================================
   CREATE BOARD
   ===================================================== */

for (let i = 0; i < 9; i++) {

    const row =
        document.createElement("tr");


    for (let j = 0; j < 9; j++) {

        const cell =
            document.createElement("td");


        const input =
            document.createElement("input");


        input.maxLength = 1;

        input.inputMode = "numeric";


        /* GIVEN NUMBER */

        if (puzzle[i][j] !== "") {

            input.value =
                puzzle[i][j];

            input.disabled = true;

        }


        cell.appendChild(input);

        row.appendChild(cell);

    }


    board.appendChild(row);

}


/* =====================================================
   CHECK SOLUTION
   ===================================================== */

function checkSolution() {

    let correct = true;


    const inputs =
        document.querySelectorAll(
            "#sudoku-board input"
        );


    inputs.forEach(
        (input, index) => {

            const row =
                Math.floor(index / 9);


            const col =
                index % 9;


            if (
                input.value !=
                solution[row][col]
            ) {

                correct = false;

            }

        }
    );


    const result =
        document.getElementById("result");


    if (correct) {

        result.innerText =
            "🎉 Correct Solution!";

        result.style.color =
            "#168c91";

    }

    else {

        result.innerText =
            "❌ Incorrect Solution. Try again!";

        result.style.color =
            "#c94b4b";

    }

}

</script>


{% endblock %}
